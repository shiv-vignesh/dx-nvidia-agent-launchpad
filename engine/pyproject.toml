[project]
name = "shiftguard"
version = "0.1.0"
description = "On-device shift-handoff agent for healthcare teams (hexagonal: pure domain + stack adapters)"
requires-python = ">=3.11"
dependencies = ["pydantic>=2"]

[project.optional-dependencies]
dev = ["pytest>=8"]
# HTTP + Swagger adapter (app/web/server.py). Kept optional so the pure domain
# and the CLI stay installable with pydantic alone.
web = ["fastapi>=0.110", "uvicorn>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
